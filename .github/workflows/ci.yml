name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
        env:
          OLLAMA_AI_ENDPOINT: ${{ vars.OLLAMA_AI_ENDPOINT }}
          OLLAMA_AI_MODEL: ${{ vars.OLLAMA_AI_MODEL }}